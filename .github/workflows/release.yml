# Keeps the npm packages on the latest release of marqius-wkhtmltopdf, and proves them first:
#
#   every hour     when marqius-wkhtmltopdf's latest GitHub release is newer than the package, each
#                  build is checked against its published SHA-256 and GitHub build provenance, and the
#                  packages are made:
#                  marqius-wkhtmltopdf and one per platform. npm installs them, as the README prints
#                  it, from a test registry on the runner, and the wkhtmltopdf and wkhtmltoimage
#                  packages make files with them on Linux (x64 and arm64), macOS (Apple silicon) and
#                  Windows. Only then are they published, the version committed and tagged, and the
#                  README's lines run again from npm itself. An hour with no new release ends after
#                  that first check: there is nothing new to test.
#   by hand        Actions > Release > Run workflow: the same, now; it also publishes the package's
#                  own release if npm lacks it, which is how the first release goes out
#   on a change    to main, or in a pull request: the packages as they stand, on the same four
#   while private  the hourly check does not run
#   publishing     only from a public repository whose variable PUBLISHING is "on"
name: Release

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      macos:
        description: "Test on GitHub's macOS too (off only while GitHub has no Mac, and the macOS checks were run on a Mac elsewhere)"
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  follow:
    # while the repository is private, the hourly check does not run (it would spend private minutes)
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.follow.outputs.publish }}
      version: ${{ steps.follow.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: follow
        name: Follow marqius-wkhtmltopdf's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(python3 -c 'import json; print(json.load(open("marqius-wkhtmltopdf/package.json"))["version"])')
          publish=false target=$have
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            latest=$(python3 .github/release.py latest)
            if python3 .github/release.py newer "$latest" "$have"; then
              publish=true target=$latest
            elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$(npm view "marqius-wkhtmltopdf@$have" version 2>/dev/null)" != "$have" ]; then
              publish=true # run by hand, and npm lacks the package's own release: the first one
            fi
          fi
          echo "package $have, latest release ${latest:-not asked}: publish=$publish version=$target"
          printf 'publish=%s\nversion=%s\n' "$publish" "$target" >>"$GITHUB_OUTPUT"
      - name: Check the release's builds and make the packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.follow.outputs.version }}
        run: |
          python3 .github/release.py fetch "$VERSION" "$RUNNER_TEMP/builds"
          python3 build.py "$VERSION" "$RUNNER_TEMP/builds" "$RUNNER_TEMP/packages"
          mkdir -p dist
          for p in "$RUNNER_TEMP"/packages/*/; do (cd "$p" && npm pack --pack-destination "$GITHUB_WORKSPACE/dist"); done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*.tgz
          retention-days: 7

  test:
    needs: follow
    # every hour, only when there is a release to publish: the other hours have nothing new to test
    if: github.event_name != 'schedule' || needs.follow.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        # (macOS left out only when a run by hand says so: GitHub had no Mac, and it was checked on one elsewhere)
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos == false && '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the packages as the README prints it, and make files with each library
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          MARQIUS_NPM_TARBALLS="$GITHUB_WORKSPACE/dist" tests/examples.sh "$tmp/w"

  publish:
    needs: [follow, test]
    if: >-
      needs.follow.outputs.publish == 'true' && github.ref == 'refs/heads/main' &&
      vars.PUBLISHING == 'on' && !github.event.repository.private
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write # npm's trusted publishing, and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish the platform packages, then marqius-wkhtmltopdf
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          # without an NPM_TOKEN secret, npm's trusted publishing for this workflow is used
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11
          for name in marqius-wkhtmltopdf-linux-x64 marqius-wkhtmltopdf-linux-arm64 marqius-wkhtmltopdf-darwin-arm64 marqius-wkhtmltopdf-win32-x64 marqius-wkhtmltopdf; do
            # asked of the version's own address: a question about a package npm does not have yet
            # (npm view) leaves npm's servers answering "not found" for five minutes after it is published
            if curl -fsS -o /dev/null "https://registry.npmjs.org/$name/$VERSION"; then echo "$name $VERSION is on npm already"; continue; fi
            npm publish "./dist/$name-$VERSION.tgz" --access public --provenance # (./: npm 11 reads dist/x.tgz as a GitHub repository)
          done
      - name: Commit and tag the release that passed
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MACOS: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
        run: |
          mac="macOS (Apple silicon)"
          [ "$MACOS" = false ] && mac="macOS (Apple silicon, on a Mac outside GitHub, which had none free)"
          node -e '
            const f = "marqius-wkhtmltopdf/package.json", p = require("./" + f), v = process.env.VERSION;
            p.version = v;
            for (const k of Object.keys(p.optionalDependencies)) p.optionalDependencies[k] = v;
            require("fs").writeFileSync(f, JSON.stringify(p, null, 2) + "\n");'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- marqius-wkhtmltopdf/package.json; then
            git add marqius-wkhtmltopdf/package.json
            git commit -q -m "marqius-wkhtmltopdf $VERSION" -m "Installed with npm and run through the wkhtmltopdf and wkhtmltoimage packages on Linux (x64, arm64), $mac and Windows, then published: $RUN_URL"
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            git tag -a "$VERSION" -m "marqius-wkhtmltopdf $VERSION" -m "Tested and published: $RUN_URL"
            git push -q origin "refs/tags/$VERSION"
          fi
          git push -q origin HEAD:main

  live:
    needs: [follow, publish]
    strategy:
      fail-fast: false
      matrix:
        # (macOS left out only when a run by hand says so: GitHub had no Mac, and it was checked on one elsewhere)
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos == false && '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.follow.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for npm to serve the release
        env:
          VERSION: ${{ needs.follow.outputs.version }}
        run: |
          # each of the five packages, asked as npm install asks: the version must be listed
          accept='application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*'
          for _ in $(seq 60); do
            missing=
            for name in marqius-wkhtmltopdf marqius-wkhtmltopdf-linux-x64 marqius-wkhtmltopdf-linux-arm64 marqius-wkhtmltopdf-darwin-arm64 marqius-wkhtmltopdf-win32-x64; do
              curl -fsS -H "Accept: $accept" "https://registry.npmjs.org/$name" 2>/dev/null |
                node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => process.exit(JSON.parse(s).versions[process.argv[1]] ? 0 : 1))' "$VERSION" ||
                missing="$missing $name"
            done
            [ -z "$missing" ] && exit 0
            echo "not yet listed:$missing"
            sleep 20
          done
          echo "npm does not serve$missing $VERSION after 20 minutes" >&2
          exit 1
      - name: The README's lines, as printed, from npm
        env:
          EXPECT_VERSION: ${{ needs.follow.outputs.version }}
          npm_config_prefer_online: "true"
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          # after a first publish, npm's servers can answer "not found" for a platform's package for
          # five minutes, and npm then leaves it out: once more, after those five minutes
          tests/examples.sh "$tmp/live" || {
            echo "Trying once more in five minutes, in case a server of npm's still had the older answer" >&2
            sleep 300
            tests/examples.sh "$tmp/live-again"
          }
